<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>消費カロリー記録</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    .entry-group {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
    .scroll-container {
      max-height: 300px;
      overflow-y: auto;
    }
    .kcal-result {
      font-weight: bold;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- ナビゲーション -->
  <nav class="nav nav-tabs bg-light">
    <a class="nav-item nav-link" href="main.html">BMI</a>
    <a class="nav-item nav-link" href="sleep.html">睡眠記録</a>
    <a class="nav-item nav-link active" href="calorie.html">消費カロリー</a>
  </nav>

  <main class="container mt-4">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="user-weight">あなたの体重（kg）</label>
          <input type="number" id="user-weight" class="form-control" placeholder="例：60" />
        </div>

        <div class="form-group">
          <label for="calorie-goal">目標消費カロリー（kcal）</label>
          <input type="number" id="calorie-goal" class="form-control" placeholder="週に1回のみ設定可能"/>
          <button id="set-goal-btn" class="btn btn-outline-secondary mt-2">目標を設定</button>
          <div id="goal-status" class="mt-2 text-muted"></div>
        </div>

        <div class="mt-3">
          <button id="add-entry-btn" class="btn btn-outline-primary">＋ 項目を追加</button>
          <button id="calculate-btn" class="btn btn-success ml-2">消費カロリーを計算</button>
        </div>

        <div id="result" class="alert alert-info mt-3" style="display:none;"></div>

        <div class="mt-3">
          <button id="download-csv" class="btn btn-outline-dark">CSV をダウンロード</button>
        </div>
      </div>

      <div class="col-md-6">
        <canvas id="comparisonChart" height="200" style="display:none;"></canvas>
        <h5 class="mt-4">履歴</h5>
        <ul id="history-list" class="list-group scroll-container"></ul>
      </div>
    </div>

    <hr />
    <div id="entries" class="mt-3"></div>
  </main>

  <script type="module" src="calorie.js"></script>
</body>
</html>
