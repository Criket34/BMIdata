<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>消費カロリー記録</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  body { padding: 20px; }
  .entry-group {
    border: 1px solid #ddd;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 15px;
  }
  #result {
    display: none;
    font-weight: bold;
    margin-top: 10px;
  }
</style>
</head>

<body>

<div class="container">

  <h2 class="mb-3">消費カロリー記録</h2>

  <!-- 現在体重 -->
  <div class="mb-3">
    <label for="user-weight" class="form-label fw-bold">現在体重（kg）</label>
    <input type="number" class="form-control" id="user-weight" placeholder="例：60">
  </div>

  <!-- 目標カロリー -->
  <div class="mb-3">
    <label for="calorie-goal" class="form-label fw-bold">目標カロリー</label>
    <input type="number" class="form-control" id="calorie-goal" placeholder="例：500">
    <button class="btn btn-primary mt-2" id="set-goal-btn">目標設定</button>
    <p id="goal-status" class="mt-2"></p>
  </div>

  <!-- 日付 -->
  <div class="mb-3">
    <label for="record-date" class="form-label fw-bold">記録日</label>
    <input type="date" class="form-control" id="record-date">
  </div>

  <!-- 項目追加 -->
  <h4 class="fw-bold mt-4">運動記録</h4>
  <div id="entries"></div>
  <button class="btn btn-secondary mb-3" id="add-entry-btn">項目追加</button>

  <!-- 計算ボタン -->
  <button class="btn btn-success mb-3" id="calculate-btn">消費カロリー計算</button>

  <!-- 結果 -->
  <div id="result" class="alert alert-info"></div>

  <!-- グラフ -->
  <h4 class="fw-bold mt-4">目標比較グラフ</h4>
  <canvas id="comparisonChart" style="max-width: 400px;"></canvas>

  <!-- 履歴 -->
  <h4 class="fw-bold mt-4">履歴</h4>
  <ul id="history-list" class="list-group mb-3"></ul>

  <!-- CSV -->
  <button class="btn btn-outline-dark" id="download-csv">CSVダウンロード</button>

</div>

<!-- Firebase Module JS -->
<script type="module" src="calorie.js"></script>

</body>
</html>
