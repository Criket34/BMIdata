<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>消費カロリー記録</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase SDKs（compat版） -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    .entry-group {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
    .flex-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .left-panel, .right-panel {
      flex: 1;
      min-width: 300px;
      margin: 10px;
    }
    .scroll-container {
      max-height: 300px;
      overflow-y: auto;
      padding-right: 10px;
    }
    #entries.scroll-container {
      min-height: 200px;
    }
    #comparisonChart {
      max-width: 100%;
    }
    .kcal-result {
      font-weight: bold;
      color: #007bff;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a href="#" class="navbar-brand">消費カロリー記録</a>
      <button id="logoutBtn" class="btn btn-outline-light">ログアウト</button>
    </div>
  </nav>

  <main class="container mt-4">
    <div class="flex-container">
      <div class="left-panel">
        <div class="form-group">
          <label for="weight">あなたの体重（kg）</label>
          <input type="number" id="weight" class="form-control" placeholder="例：60" />
        </div>
        <div class="form-group">
          <label for="calorie-goal">目標消費カロリー（kcal）</label>
          <input type="number" id="calorie-goal" class="form-control" placeholder="週に1回のみ設定可能"/>
          <button id="set-goal-btn" class="btn btn-outline-secondary mt-2">目標を設定</button>
          <div id="goal-status" class="mt-2 text-muted"></div>
        </div>
      </div>

      <div class="right-panel">
        <canvas id="comparisonChart" height="200" style="display:none;"></canvas>
      </div>
    </div>

    <hr/>

    <!-- 運動入力欄 -->
    <div class="entry-group">
      <div class="form-group">
        <label for="category">運動カテゴリー</label>
        <select id="category" class="form-control">
          <option value="">選択してください</option>
        </select>
      </div>
      <div class="form-group">
        <label for="exercise">運動名</label>
        <select id="exercise" class="form-control">
          <option value="">選択してください</option>
        </select>
      </div>
      <div id="exerciseInfo" class="text-info font-weight-bold mb-2"></div>

      <div class="form-group">
        <label for="duration">運動時間（分）</label>
        <input type="number" id="duration" class="form-control" placeholder="例：30" />
      </div>
      <button id="recordBtn" class="btn btn-primary">記録</button>
    </div>

    <!-- 結果 -->
    <div id="result" class="alert alert-info" style="display:none;"></div>

    <!-- 履歴 -->
    <h5 class="mt-4">履歴</h5>
    <ul id="historyList" class="list-group scroll-container" style="max-height: 200px;"></ul>
  </main>

  <script src="calorie.js" type="module" defer></script>
</body>
</html>
