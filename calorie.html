<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>消費カロリー記録</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <style>
    #entries, #history-container {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 1em;
    }
    .kcal-result {
      margin-bottom: 10px;
      font-weight: bold;
    }
    #comparisonChart {
      max-width: 100%;
      height: 300px;
      display: none;
    }
  </style>
</head>
<body class="container py-4">
  <h1 class="mb-4">消費カロリー記録</h1>

  <div class="form-group">
    <label for="user-weight">体重（kg）</label>
    <input type="number" id="user-weight" class="form-control" placeholder="例：60">
  </div>

  <div id="entries" class="mb-3"></div>
  <button id="add-entry-btn" class="btn btn-secondary mb-3">＋運動追加</button>

  <div>
    <button id="calculate-btn" class="btn btn-primary">カロリー計算・記録</button>
  </div>

  <div id="result" class="alert alert-info mt-3" style="display:none;"></div>

  <canvas id="comparisonChart" class="mt-4"></canvas>

  <hr>

  <div class="form-group">
    <label for="calorie-goal">週あたりの目標カロリー</label>
    <input type="number" id="calorie-goal" class="form-control" placeholder="例：1500">
    <button id="set-goal-btn" class="btn btn-outline-primary mt-2">目標を設定</button>
    <div id="goal-status" class="mt-2 text-info"></div>
  </div>

  <hr>

  <h3>履歴</h3>
  <div id="history-container">
    <ul id="history-list" class="list-group"></ul>
  </div>

  <div class="mt-3">
    <button id="login-btn" class="btn btn-success">Googleでログイン</button>
    <button id="logout-btn" class="btn btn-danger" style="display:none;">ログアウト</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="calorie.js"></script>
</body>
</html>
