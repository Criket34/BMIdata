<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>消費カロリー記録</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    .entry-group {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a href="#" class="navbar-brand">消費カロリー記録</a>
    </div>
  </nav>

  <main class="container mt-4">
    <div class="form-group">
      <label for="user-weight">あなたの体重（kg）</label>
      <input type="number" id="user-weight" class="form-control" placeholder="例：60" />
    </div>

    <div class="form-group">
      <label for="calorie-goal">目標消費カロリー（kcal）</label>
      <input type="number" id="calorie-goal" class="form-control" placeholder="週に1回のみ設定可能"/>
      <button id="set-goal-btn" class="btn btn-outline-secondary mt-2">目標を設定</button>
      <div id="goal-status" class="mt-2 text-muted"></div>
    </div>

    <hr>

    <div id="entries"></div>

    <div class="mb-3">
      <button id="add-entry-btn" class="btn btn-outline-primary">＋ 項目を追加</button>
      <button id="calculate-btn" class="btn btn-success">消費カロリーを計算</button>
    </div>

    <div id="result" class="alert alert-info" style="display:none;"></div>

    <canvas id="comparisonChart" height="100" style="display:none;"></canvas>
  </main>

  <script src="calorie.js" defer></script>
</body>
</html>
