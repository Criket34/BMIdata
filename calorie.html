<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>消費カロリー記録</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { padding: 20px; }
    #entries { max-height: 300px; overflow-y: auto; margin-bottom: 10px; }
    #history-list { max-height: 400px; overflow-y: auto; }
    .entry-group { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
    .kcal-result { font-weight: bold; margin-top: 5px; }
    canvas { max-width: 100%; }
    .btn-space { margin-right: 5px; }
  </style>
</head>
<body>
  <div class="container">

    <!-- 上部入力 -->
    <div class="row mb-3">
      <div class="col-md-2">
        <label>体重（kg）</label>
        <input type="number" class="form-control" id="user-weight" placeholder="60">
      </div>
      <div class="col-md-2">
        <label>目標カロリー（kcal）</label>
        <input type="number" class="form-control" id="calorie-goal">
      </div>
      <div class="col-md-2">
        <label>日付</label>
        <input type="date" class="form-control" id="record-date">
      </div>
      <div class="col-md-6 d-flex align-items-end">
        <button class="btn btn-primary btn-space" id="set-goal-btn">目標設定</button>
        <button class="btn btn-success btn-space" id="calculate-btn">消費カロリー計算</button>
        <button class="btn btn-secondary btn-space" id="download-csv">CSVダウンロード</button>
      </div>
    </div>

    <!-- グラフ -->
    <div class="row mb-3">
      <div class="col-md-12">
        <canvas id="comparisonChart"></canvas>
      </div>
    </div>

    <!-- 履歴 -->
    <div class="row mb-3">
      <div class="col-md-12">
        <h5>履歴</h5>
        <ul class="list-group" id="history-list"></ul>
      </div>
    </div>

    <!-- 運動項目入力 -->
    <div class="row">
      <div class="col-md-12">
        <h5>運動項目</h5>
        <div id="entries"></div>
        <button class="btn btn-info mt-2" id="add-entry-btn">項目追加</button>
      </div>
    </div>

    <!-- 計算結果表示 -->
    <div class="row mt-3">
      <div class="col-md-12">
        <div id="result" style="display:none; font-weight:bold;"></div>
      </div>
    </div>

    <!-- 目標ステータス -->
    <div class="row mt-1">
      <div class="col-md-12">
        <div id="goal-status"></div>
      </div>
    </div>

  </div>

  <script type="module" src="calorie.js"></script>
</body>
</html>
