<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>消費カロリー記録</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    header {
      background-color: #3f51b5;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.4rem;
    }
    .container {
      display: flex;
      height: calc(100vh - 64px); /* ヘッダー高さを除外 */
    }
    .input-section, .history-section {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      box-sizing: border-box;
    }
    .input-section {
      background-color: #ffffff;
      border-right: 1px solid #ddd;
    }
    .history-section {
      background-color: #fafafa;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    select, input[type="number"], input[type="text"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      margin-top: 15px;
      padding: 10px 15px;
      font-size: 1rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .record-item {
      padding: 10px;
      background-color: #fff;
      border: 1px solid #ddd;
      margin-bottom: 10px;
    }
    .record-item button {
      background-color: #f44336;
      margin-top: 8px;
    }
    .record-item button:hover {
      background-color: #d32f2f;
    }
    .undo-button {
      background-color: #2196F3;
      margin-left: 10px;
    }
    .undo-button:hover {
      background-color: #1976D2;
    }
    .goal-section {
      margin-top: 20px;
      padding: 10px;
      background-color: #e3f2fd;
      border: 1px solid #90caf9;
    }
  </style>
</head>
<body>
  <header>消費カロリー記録</header>

  <div class="container">
    <!-- 入力エリア -->
    <div class="input-section">
      <label for="category">運動カテゴリー</label>
      <select id="category"></select>

      <label for="exercise">運動名</label>
      <select id="exercise"></select>

      <label for="duration">運動時間（分）</label>
      <input type="number" id="duration" min="1" />

      <label for="weight">体重（kg）</label>
      <input type="number" id="weight" min="1" />

      <button id="recordButton">記録する</button>

      <div class="goal-section">
        <label for="goal">1日の消費カロリー目標（kcal）</label>
        <input type="number" id="goal" min="1" />
        <button id="setGoalButton">目標を設定</button>
        <p id="goalInfo"></p>
        <canvas id="goalChart" width="400" height="300"></canvas>
      </div>
    </div>

    <!-- 履歴エリア -->
    <div class="history-section">
      <h3>記録履歴</h3>
      <div id="recordsContainer"></div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <!-- Chart.js（目標グラフ用） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- ローカルJS -->
  <script src="calorie.js"></script>
</body>
</html>
