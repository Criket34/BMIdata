<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BMI計算機</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
  <div class="container pt-4">
    <h2 id="user-label">BMI計算機</h2>
    <div class="form-group">
      <label for="height-input">身長 (cm)</label>
      <input id="height-input" class="form-control" type="text">
    </div>
    <div class="form-group">
      <label for="weight-input">体重 (kg)</label>
      <input id="weight-input" class="form-control" type="text">
    </div>
    <button id="button-submit" class="btn btn-primary">計測</button>
    <button id="button-reset" class="btn btn-secondary">リセット</button>
    
    <div class="mt-3">
      <h4>結果</h4>
      <p id="bmi-output"></p>
      <p id="message"></p>
    </div>

    <div class="mt-4">
      <h4>履歴</h4>
      <ul id="history-list" class="list-group"></ul>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
