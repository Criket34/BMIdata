<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>BMI計算機</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
    crossorigin="anonymous">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @media (max-width: 768px) {
      #height-input, #weight-input {
        font-size: 1.5rem;
        padding: 1rem;
      }

      #custom-keypad .btn {
        font-size: 1.5rem;
        padding: 1rem;
      }
    }

    .input-selector {
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .border-primary {
      border: 2px solid #007bff !important;
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a href="#" class="navbar-brand">BMI計算機</a>
      </div>
    </nav>
  </header>

  <nav class="nav nav-tabs bg-light">
    <a class="nav-item nav-link active" href="main.html">BMI</a>
    <a class="nav-item nav-link" href="sleep.html">睡眠記録</a>
    <a class="nav-item nav-link" href="calorie.html">消費カロリー</a>
  </nav>

  <main>
    <div class="container">
      <div class="row">
        <!-- 入力フォーム -->
        <section class="col-sm-6 col-md-4 pt-4">
          <div class="form-group">
            <label for="height-input">身長 (cm)</label>
            <input id="height-input" type="text" class="form-control" value="">
          </div>
          <div class="form-group">
            <label for="weight-input">体重 (kg)</label>
            <input id="weight-input" type="text" class="form-control" value="">
          </div>

          <!-- 追加: 記録日（年月日だけ指定） -->
          <div class="form-group">
            <label for="record-date">記録日</label>
            <input id="record-date" type="date" class="form-control" />
            <small class="form-text text-muted">未選択の場合は今日の日付で保存されます。</small>
          </div>

          <input id="button-submit" type="submit" class="btn btn-primary btn-large mr-2" value="計測開始">
          <button id="button-reset" type="button" class="btn btn-secondary btn-large mt-2">リセット</button>

          <!-- スマホ専用 -->
          <div class="mt-3 d-block d-md-none">
            <button class="btn btn-info mb-2 btn-block" id="focus-height">身長を入力</button>
            <button class="btn btn-info mb-2 btn-block" id="focus-weight">体重を入力</button>
          </div>

          <div id="custom-keypad" class="d-block d-md-none mt-3">
            <div class="btn-group d-flex flex-wrap">
              <button type="button" class="btn btn-outline-dark m-1 flex-fill keypad-btn">1</button>
              <button type="button" class="btn btn-outline-dark m-1 flex-fill keypad-btn">2</button>
              <button type="button" class="btn btn-outline-dark m-1 flex-fill keypad-btn">3</button>
              <button type="button" class="btn btn-outline-dark m-1 flex-fill keypad-btn">4</button>
              <button type="button" class="btn btn-outline-dark m-1 flex-fill keypad-btn">5</button>
              <button type="button" class="btn btn-outline-dark m-1 flex-fill keypad-btn">6</button>
              <button type="button" class="btn btn-outline-dark m-1 flex-fill keypad-btn">7</button>
              <button type="button" class="btn btn-outline-dark m-1 flex-fill keypad-btn">8</button>
              <button type="button" class="btn btn-outline-dark m-1 flex-fill keypad-btn">9</button>
              <button type="button" class="btn btn-outline-dark m-1 flex-fill keypad-btn">0</button>
              <button type="button" class="btn btn-outline-secondary m-1 flex-fill keypad-btn">.</button>
              <button type="button" class="btn btn-outline-danger m-1 flex-fill keypad-btn">⌫</button>
            </div>
          </div>
        </section>

        <!-- 結果表示 -->
        <section class="col-sm-6 col-md-4 pt-4">
          <div class="card">
            <div class="card-header">あなたのBMIは</div>
            <div class="card-body">
              <div id="bmi-output" class="display-4"></div>
              <div id="error-message" style="font-size: 0.8rem; color: red; margin-top: 5px;"></div>
              <div id="message" class="mt-3"></div>
            </div>
          </div>

          <div class="mt-4">
            <h5>過去のBMI履歴</h5>
            <ul id="bmi-history" class="list-group"></ul>

            <a href="#" id="view-graph-btn" class="btn btn-success btn-block mt-3">グラフで見る</a>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- Firebase（compat）SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <!-- メインスクリプト（外部ファイル） -->
  <script src="main.js"></script>
</body>
</html>
