<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>睡眠時間記録</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <style>
    @media (max-width: 768px) {
      #download-csv,
      #view-graph {
        display: block;
        width: 100%;
        margin-top: 10px;
      }
    }
    #history {
      max-height: 300px;
      overflow-y: auto;
    }
    #result {
      display: none;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a href="#" class="navbar-brand">睡眠時間記録</a>
      </div>
    </nav>
  </header>

  <nav class="nav nav-tabs bg-light">
    <a class="nav-item nav-link" href="main.html">BMI</a>
    <a class="nav-item nav-link active" href="sleep.html">睡眠記録</a>
    <a class="nav-item nav-link" href="calorie.html">消費カロリー</a>
  </nav>

  <main>
    <div class="container pt-4">
      <div class="row">
        <!-- 入力フォーム -->
        <section class="col-md-6 mb-4">
          <div class="form-group">
            <label for="user-id">ユーザーID</label>
            <input type="text" id="user-id" class="form-control" placeholder="IDを入力">
          </div>

          <div class="form-group">
            <label for="record-date">記録日付（任意）</label>
            <input type="date" id="record-date" class="form-control">
            <small class="form-text text-muted">未入力の場合は本日の日付が使用されます</small>
          </div>

          <div class="form-group">
            <label for="sleepTime">就寝時刻（例: 23:00）</label>
            <input type="time" id="sleepTime" class="form-control">
          </div>
          <div class="form-group">
            <label for="wakeTime">起床時刻（例: 07:00）</label>
            <input type="time" id="wakeTime" class="form-control">
          </div>
          <div class="form-group form-check">
            <input type="checkbox" id="isWeekend" class="form-check-input">
            <label for="isWeekend" class="form-check-label">休日の記録です</label>
          </div>

          <div class="form-group">
            <label>睡眠の質（1〜4）<br>
              <small class="text-muted">(1: 悪い、2: やや悪い、3: やや良い、4: 良い)</small>
            </label><br />
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="quality" id="q1" value="1">
              <label class="form-check-label" for="q1">1</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="quality" id="q2" value="2">
              <label class="form-check-label" for="q2">2</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="quality" id="q3" value="3">
              <label class="form-check-label" for="q3">3</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="quality" id="q4" value="4">
              <label class="form-check-label" for="q4">4</label>
            </div>
          </div>

          <!-- 記録ボタン -->
          <button id="record-button" class="btn btn-primary btn-block mb-3">記録する</button>

          <!-- ▼ ここに移動：CSV・グラフボタン -->
          <div class="text-center mb-3">
            <button id="download-csv" class="btn btn-success mr-2">CSVをダウンロード</button>
            <a href="sleep-graph.html" id="view-graph" class="btn btn-info">グラフを見る</a>
          </div>
          <!-- ▲ 移動ここまで -->

          <div id="result" class="alert alert-info mt-3">
            <div id="sleep-result" class="font-weight-bold"></div>
            <div id="sleep-comment" class="mt-2"></div>
          </div>
        </section>

        <!-- 履歴表示 -->
        <section class="col-md-6 mb-4">
          <h5>過去の記録</h5>
          <ul id="history-list" class="list-group mb-3"></ul>
          <div class="alert alert-warning d-none" id="undo-box">
            <span>直前の削除を元に戻せます。</span>
            <button id="undo-button" class="btn btn-sm btn-outline-dark ml-2">元に戻す</button>
          </div>
          <p id="most-common-chronotype" class="mt-3 font-weight-bold text-primary"></p>
        </section>
      </div>
    </div>
  </main>

  <!-- Firebase SDK -->
  <script type="module" src="sleep.js"></script>
</body>
</html>
