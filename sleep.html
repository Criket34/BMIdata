<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>睡眠時間記録</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <style>
    @media (max-width: 768px) {
      #download-btn {
        display: block;
        width: 100%;
        margin-top: 10px;
      }
    }

    #sleep-history {
      max-height: 300px;
      overflow-y: auto;
    }

    #result-box {
      display: none;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <!-- ナビバー -->
  <header>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a href="#" class="navbar-brand">睡眠時間記録</a>
      </div>
    </nav>
  </header>

  <!-- ナビゲーションタブ -->
  <nav class="nav nav-tabs bg-light">
    <a class="nav-item nav-link" href="main.html">BMI</a>
    <a class="nav-item nav-link active" href="sleep.html">睡眠記録</a>
  </nav>

  <!-- メイン -->
  <main>
    <div class="container pt-4">
      <div class="row">
        <!-- 入力フォーム -->
        <section class="col-md-6 mb-4">
          <div class="form-group">
            <label for="sleep-start">就寝時刻（例: 23:00）</label>
            <input type="time" id="sleep-start" class="form-control">
          </div>
          <div class="form-group">
            <label for="sleep-end">起床時刻（例: 07:00）</label>
            <input type="time" id="sleep-end" class="form-control">
          </div>
          <button id="record-btn" class="btn btn-primary btn-block">記録する</button>

          <!-- 結果表示エリア -->
          <div id="result-box" class="alert alert-info mt-3">
            <div id="sleep-result" class="font-weight-bold"></div>
            <div id="sleep-comment" class="mt-2"></div>
          </div>
        </section>

        <!-- 履歴表示 -->
        <section class="col-md-6 mb-4">
          <h5>過去の記録</h5>
          <ul id="sleep-history" class="list-group"></ul>

          <!-- スマホ向け履歴テキスト出力 -->
          <pre id="text-output" class="mt-3 d-block d-md-none"></pre>
        </section>
      </div>

      <!-- エクスポートセクション -->
      <hr>
      <section class="mt-4">
        <h5>エクスポート</h5>
        <button id="download-btn" class="btn btn-success">テキストファイルをダウンロード</button>
      </section>
    </div>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <!-- スクリプトをDOM読み込み後に実行 -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const script = document.createElement('script');
      script.src = 'sleep.js';
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
