<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ログイン画面</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">ログイン / ユーザー登録</h2>

    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" class="form-control" placeholder="example@example.com">
    </div>

    <div class="form-group">
      <label for="password">パスワード</label>
      <input type="password" id="password" class="form-control" placeholder="パスワードを入力">
    </div>

    <button id="login-btn" class="btn btn-primary mt-2">ログイン</button>
    <button id="register-btn" class="btn btn-success mt-2 ml-2">新規登録</button>
    <button id="reset-password-btn" class="btn btn-warning mt-2 ml-2">パスワード再設定</button>

    <p class="mt-4 text-muted">
      パスワードを忘れた場合は「パスワード再設定」ボタンを押してください。
    </p>
  </div>

  <!-- Firebase v10 SDK -->
  <script type="module" src="index.js"></script>
</body>
</html>
