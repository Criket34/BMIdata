<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ログイン画面</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
    crossorigin="anonymous">
</head>
<body>
  <div class="container mt-5">
    <h2>ログイン / ユーザー登録</h2>
    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" class="form-control">
    </div>
    <div class="form-group">
      <label for="password">パスワード</label>
      <input type="password" id="password" class="form-control">
    </div>
    <button id="login-btn" class="btn btn-primary mt-2">ログイン</button>
    <button id="register-btn" class="btn btn-secondary mt-2">新規登録</button>
  </div>

  <!-- ✅ Firebase SDK（互換モード CDN）-->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <script>
    // ✅ Firebase構成
    const firebaseConfig = {
      apiKey: "AIzaSyAqrTNSA-E-fq_63oS3cNjgeC7WYr3l-bQ",
      authDomain: "bmi-app-a99f3.firebaseapp.com",
      projectId: "bmi-app-a99f3",
      storageBucket: "bmi-app-a99f3.appspot.com",
      messagingSenderId: "168322055498",
      appId: "1:168322055498:web:YOUR_APP_ID_HERE" // ← 必要に応じて更新
    };

    // ✅ Firebase初期化
    firebase.initializeApp(firebaseConfig);
  </script>

  <!-- イベント処理 -->
  <script src="index.js"></script>
</body>
</html>
