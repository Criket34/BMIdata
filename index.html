<html>
<head>
  <meta charset="utf-8">
  <title>ログイン画面</title>

<body>
  <div class="container mt-5">
    <h2>ログイン / ユーザー登録</h2>
    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" class="form-control">
    </div>
    <div class="form-group">
      <label for="password">パスワード</label>
      <input type="password" id="password" class="form-control">
    </div>
    <button id="login-btn" class="btn btn-primary mt-2">ログイン</button>
    <button id="register-btn" class="btn btn-secondary mt-2">新規登録</button>
  </div>

  <!-- Firebase SDK -->
